name: Update AUR Package

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version tag (e.g. v2.1.0). Leave empty for latest.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.app_version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG=$(gh api repos/Vadko/lbk-launcher/releases --jq 'first | .tag_name')
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Not a release tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved: $TAG"

      - name: Download AppImage via gh CLI (supports draft releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release download "$TAG" \
            --repo Vadko/lbk-launcher \
            --pattern "LBK-Launcher-linux.AppImage" \
            --output "aur/LBK-Launcher-linux-${VERSION}.AppImage"

      - name: Update PKGBUILD version, checksums and .SRCINFO
        uses: docker://archlinux:base-devel
        env:
          VERSION: ${{ steps.release.outputs.version }}
        with:
          args: >-
            bash -c "
              pacman -Sy --noconfirm pacman-contrib &&
              useradd -m builder &&
              cd aur &&
              sed -i \"s/^pkgver=.*/pkgver=${VERSION}/\" PKGBUILD &&
              sed -i \"s/^pkgrel=.*/pkgrel=1/\" PKGBUILD &&
              chown -R builder: . &&
              su builder -c 'updpkgsums && makepkg --printsrcinfo > .SRCINFO'
            "

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: lbk-launcher-bin
          pkgbuild: aur/PKGBUILD
          commit_username: LBK Bot
          commit_email: info@lbklauncher.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "Update to v${{ steps.release.outputs.version }}"
          assets: |
            aur/lbk-launcher.sh
            aur/lbk-launcher.desktop
            aur/.SRCINFO

      - name: Create PR with updated PKGBUILD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          BRANCH="aur/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add aur/PKGBUILD aur/.SRCINFO
          git commit -m "aur: update to v${VERSION}" || exit 0
          git push -u origin "$BRANCH" --force
          PR_URL=$(gh pr create --title "aur: update to v${VERSION}" --body "Auto-update AUR package to v${VERSION}" --base main)
          gh pr merge "$PR_URL" --auto --squash
